[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-cost-plan"
version = "0.1.0"
description = "Validate a local AWS cost and teardown plan"
requires-python = ">=3.11"

[project.scripts]
aws-cost-plan = "aws_cost_plan.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
