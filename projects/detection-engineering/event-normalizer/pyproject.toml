[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-event-normalizer"
version = "0.1.0"
description = "Normalize selected Suricata EVE and Zeek JSON events"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
security-event-normalizer = "event_normalizer.cli:main"
security-event-benchmark = "event_normalizer.benchmark_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
