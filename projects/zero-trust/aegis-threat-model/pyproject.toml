[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-threat-model"
version = "0.1.0"
description = "Validate a scoped threat catalog for an AI tool authorization core"
requires-python = ">=3.11"
dependencies = ["cryptography>=43,<47"]

[project.scripts]
aegis-threat-model = "aegis_threat_model.cli:main"
aegis-verify-request = "aegis_threat_model.verify_cli:main"
aegis-authorize-request = "aegis_threat_model.authorization_cli:main"
aegis-policy-cases = "aegis_threat_model.policy_cli:main"
aegis-opa-conformance = "aegis_threat_model.opa_conformance_cli:main"
aegis-audit-chain = "aegis_threat_model.audit_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
